# BossRespawnMarker (extends Display.TextDisplay): needs to set its countdown text
# and vertical billboard from the server tick. Same widenings as Twilight Forest's own
# accesstransformer.cfg (used by its "Final Castle WIP" text display).
public net.minecraft.world.entity.Display setBillboardConstraints(Lnet/minecraft/world/entity/Display$BillboardConstraints;)V
public net.minecraft.world.entity.Display$TextDisplay setText(Lnet/minecraft/network/chat/Component;)V

# BossRespawnMarker's attack hitbox (Interaction, same trick as TF's "Final Castle WIP"):
# width/height setters are private in vanilla; same widenings as TF's accesstransformer.cfg.
public net.minecraft.world.entity.Interaction setHeight(F)V
public net.minecraft.world.entity.Interaction setWidth(F)V
